<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 484" width="900" height="484" role="img" aria-labelledby="t d" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',ui-monospace,monospace">
<title id="t">Projects</title><desc id="d">Four security projects, all live: logguard (log analysis and detection mapped to MITRE ATT&amp;CK), terraform-aws-secure-baseline (AWS baseline in Terraform scanned with Checkov), devsecops-pipeline (CI/CD with security gates) and iso27001-risk-assessment-pack (a self-study risk assessment).</desc>
<defs><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".25"/></pattern></defs>
<rect width="900" height="484" rx="10" fill="#050a09"/>
<rect x=".5" y=".5" width="899" height="483" rx="10" fill="none" stroke="#16302a"/>
<text x="26" y="34" font-size="13.5" fill="#5f8a7b"><tspan fill="#3dff9a" font-weight="700">arjun@sec-ops</tspan>:~$ <tspan fill="#c9f5e1">ls -l projects/</tspan></text>
<line x1="26" x2="874" y1="48" y2="48" stroke="#16302a" stroke-dasharray="3 3"/>
<text x="26" y="76" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">logguard</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  python · unittest · github-actions</tspan></text><text x="26" y="98" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Reads SSH and web server logs, detects brute force, password spraying, suspicious logins and web</tspan></text><text x="26" y="120" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  attacks, maps findings to MITRE ATT&amp;CK and writes JSON alerts plus a Markdown incident report.</tspan></text><text x="26" y="142" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Unit-tested, runs in CI.</tspan></text><text x="26" y="186" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">terraform-aws-secure-baseline</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  terraform · aws · checkov</tspan></text><text x="26" y="208" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Modular AWS security baseline as code: KMS encryption, multi-region CloudTrail with log</tspan></text><text x="26" y="230" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  validation, CIS-style alarms, MFA-gated access, private VPC with flow logs. Scanned with Checkov</tspan></text><text x="26" y="252" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  in CI, every accepted risk documented.</tspan></text><text x="26" y="296" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">devsecops-pipeline</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  github-actions · bandit · trivy · gitleaks</tspan></text><text x="26" y="318" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Flask API with a GitHub Actions pipeline: tests with a coverage gate, Bandit, pip-audit, Gitleaks,</tspan></text><text x="26" y="340" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Checkov, Hadolint and Trivy scans, an SBOM and a hardened-container smoke test. Main branch is</tspan></text><text x="26" y="362" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  protected and needs all checks green.</tspan></text><text x="26" y="406" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">iso27001-risk-assessment-pack</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  excel · iso/iec 27001:2022</tspan></text><text x="26" y="428" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Self-study ISMS risk assessment for a fictional company: methodology, risk register, treatment</tspan></text><text x="26" y="450" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  plan, Statement of Applicability. A study exercise, not a compliance claim.</tspan></text>
<rect width="900" height="484" rx="10" fill="url(#scan)" pointer-events="none"/>
</svg>