<title id="t">Career timeline</title><desc id="d">Career as a git log. M.Sc. Cybersecurity at SRH University Leipzig since 2024. Web Developer and UI/UX Designer internship at AttackBox, Jan to Apr 2024. B.Tech CSE Cyber Security at Ganpat University, 2020 to 2024. Web Developer at H&amp;B Computer Education, May to Jul 2022. Graphic Designer at The Karma Foundation, Mar to May 2021.</desc>
