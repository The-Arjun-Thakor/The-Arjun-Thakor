<text x="26" y="76" font-size="13.5" xml:space="preserve"><tspan fill="#c9f5e1" font-weight="700">M.Sc. Cybersecurity</tspan><tspan fill="#c9f5e1"> student at SRH University Leipzig (2024 - present).</tspan></text><text x="26" y="98" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">B.Tech CSE (Cyber Security), Ganpat University.</tspan></text><text x="26" y="142" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">I started out building websites and designing interfaces, and now I work on the</tspan></text><text x="26" y="164" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">defensive side: log analysis and detection, cloud security as code, incident</tspan></text><text x="26" y="186" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">response and risk management. I break things to learn how to defend them.</tspan></text><text x="26" y="230" font-size="13.5" xml:space="preserve"><tspan fill="#3ee6ff">status : </tspan><tspan fill="#3dff9a">open to IT security roles in Germany and the EU</tspan></text><text x="26" y="252" font-size="13.5" xml:space="preserve"><tspan fill="#5f8a7b">         (SOC / security analyst, security engineering, GRC)</tspan></text><text x="26" y="274" font-size="13.5" xml:space="preserve"><tspan fill="#3ee6ff">langs  : </tspan><tspan fill="#c9f5e1">English (fluent), German (B1)</tspan></text><text x="26" y="296" font-size="13.5" xml:space="preserve"><tspan fill="#3ee6ff">motto  : </tspan><tspan fill="#ffc04d">I'm always trying to do better .....</tspan></text>
