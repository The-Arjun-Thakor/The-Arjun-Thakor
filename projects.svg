<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',ui-monospace,monospace">
<title id="t">Projects</title><desc id="d">Four security projects. Live: logguard, a Python log analysis and detection tool mapped to MITRE ATT&amp;CK, and terraform-aws-secure-baseline, an AWS security baseline in Terraform scanned with Checkov. Coming soon: a DevSecOps CI/CD pipeline and an ISO 27001 risk assessment example.</desc>
<defs><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".25"/></pattern></defs>
<rect width="900" height="440" rx="10" fill="#050a09"/>
<rect x=".5" y=".5" width="899" height="439" rx="10" fill="none" stroke="#16302a"/>
<text x="26" y="34" font-size="13.5" fill="#5f8a7b"><tspan fill="#3dff9a" font-weight="700">arjun@sec-ops</tspan>:~$ <tspan fill="#c9f5e1">ls -l projects/</tspan></text>
<line x1="26" x2="874" y1="48" y2="48" stroke="#16302a" stroke-dasharray="3 3"/>
<text x="26" y="76" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">logguard</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  python · unittest · github-actions</tspan></text><text x="26" y="98" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Reads SSH and web server logs, detects brute force, password spraying, suspicious logins and web</tspan></text><text x="26" y="120" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  attacks, maps findings to MITRE ATT&amp;CK and writes JSON alerts plus a Markdown incident report.</tspan></text><text x="26" y="142" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Unit-tested, runs in CI.</tspan></text><text x="26" y="186" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">terraform-aws-secure-baseline</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#3dff9a" font-weight="700">[LIVE]</tspan><tspan fill="#5f8a7b">  terraform · aws · checkov</tspan></text><text x="26" y="208" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Modular AWS security baseline as code: KMS encryption, multi-region CloudTrail with log</tspan></text><text x="26" y="230" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  validation, CIS-style alarms, MFA-gated access, private VPC with flow logs. Scanned with Checkov</tspan></text><text x="26" y="252" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  in CI, every accepted risk documented.</tspan></text><text x="26" y="296" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">devsecops-pipeline</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#ffc04d" font-weight="700">[SOON]</tspan><tspan fill="#5f8a7b">  github-actions · bandit · trivy</tspan></text><text x="26" y="318" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  CI/CD pipeline that gates changes on tests, SAST, dependency, secret and container scanning.</tspan></text><text x="26" y="362" font-size="13.5" xml:space="preserve"><tspan fill="#3dff9a">▸ </tspan><tspan fill="#3ee6ff" font-weight="700">iso27001-risk-assessment-example</tspan><tspan fill="#c9f5e1">  </tspan><tspan fill="#ffc04d" font-weight="700">[SOON]</tspan><tspan fill="#5f8a7b">  excel · iso/iec 27001:2022</tspan></text><text x="26" y="384" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  Self-study ISMS risk assessment for a fictional company: methodology, risk register, treatment</tspan></text><text x="26" y="406" font-size="13.5" xml:space="preserve"><tspan fill="#a9d8c3">  plan, Statement of Applicability.</tspan></text>
<rect width="900" height="440" rx="10" fill="url(#scan)" pointer-events="none"/>
</svg>